<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผลงานของเรา | BAKE BOLD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Kanit:wght@700&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Gallery Grid Dynamic Layout */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
    }
    .gallery-item {
      position: relative;
      background: var(--white);
      padding: 15px;
      border: var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: transform 0.3s;
    }
    .gallery-item:nth-child(even) { transform: rotate(1.5deg); }
    .gallery-item:nth-child(odd) { transform: rotate(-1.5deg); }
    .gallery-item:hover {
      transform: scale(1.03) rotate(0deg);
      box-shadow: var(--shadow-lg);
      z-index: 10;
    }
    .gallery-item img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border: 2px solid var(--black);
      border-radius: 12px;
    }
    .item-title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="nav-logo">BAKE BOLD 🍰</a>
      <div class="menu-toggle" id="mobile-menu">☰</div>
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="services.html">บริการของเรา</a></li>
        <li><a href="work.html" class="active">ผลงานเค้ก</a></li>
        <li><a href="process.html">ขั้นตอนการสั่ง</a></li>
        <li><a href="contact.html">ติดต่อเรา</a></li>
      </ul>
    </div>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>CAKE GALLERY</h1>
    </div>

    <div class="gallery-grid">
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1535141192574-5d4897c13136?auto=format&fit=crop&w=600&q=80" alt="Neon Retro Cake">
        <div class="item-title">Neon Retro Vibes</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?auto=format&fit=crop&w=600&q=80" alt="Pastel Strawberry Cake">
        <div class="item-title">Pastel Strawberry Dream</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=600&q=80" alt="Chocolate Overload">
        <div class="item-title">Chocolate Overload</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1542826438-bd32fcf33371?auto=format&fit=crop&w=600&q=80" alt="Comic Style Cake">
        <div class="item-title">Pop Art Comic Cake</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1586985289688-ca3cf47d3e6e?auto=format&fit=crop&w=600&q=80" alt="Minimal Peach">
        <div class="item-title">Minimalist Peach</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80" alt="Flower Power Cake">
        <div class="item-title">Flower Power 70s</div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <div class="footer-logo">BAKE BOLD</div>
      <p>© 2026 BAKE BOLD Studio. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('mobile-menu').addEventListener('click', () => {
      document.getElementById('nav-links').classList.toggle('active');
    });
  </script>
</body>
</html>
